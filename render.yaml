services:
  - type: web
    name: cloudix-bot
    runtime: node
    plan: starter

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: AUTH_FOLDER
        value: /data/auth

    disk:
      name: cloudix-bot-data
      mountPath: /data
      sizeGB: 1